<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>霓虹贪吃蛇</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0b1020;color:#eef3ff;font-family:system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:18px}
.wrap{width:min(94vw,520px)}header{display:flex;align-items:end;justify-content:space-between;margin-bottom:12px}h1{font-size:25px;margin:0}.meta{display:flex;gap:16px;text-align:right}.num{font-weight:800;font-size:21px}.lab{font-size:11px;color:#91a0bd}
.board{position:relative;background:#10182d;border:1px solid #263555;border-radius:18px;padding:10px;box-shadow:0 18px 50px #0007}canvas{display:block;width:100%;aspect-ratio:1;background:#08101d;border-radius:12px;touch-action:none}
.overlay{position:absolute;inset:10px;display:grid;place-items:center;background:#07101ccc;border-radius:12px;text-align:center;padding:30px}.overlay.hide{display:none}.overlay h2{margin:0 0 8px;font-size:30px}.overlay p{color:#a9b5cc;margin:0 0 18px}
button{border:0;border-radius:12px;background:#69f0ae;color:#062016;font-weight:800;font-size:16px;padding:12px 22px}
.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;width:230px;margin:16px auto 0}.controls button{background:#172440;color:#dce8ff;padding:13px;font-size:21px}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}
.tip{text-align:center;color:#8291ae;font-size:12px;margin-top:12px}
</style></head><body><main class="wrap"><header><div><h1>🐍 霓虹贪吃蛇</h1><div class="lab">GitHub 自动开发验收版</div></div><div class="meta"><div><div id="score" class="num">0</div><div class="lab">分数</div></div><div><div id="best" class="num">0</div><div class="lab">最高</div></div></div></header>
<section class="board"><canvas id="game" width="400" height="400"></canvas><div id="overlay" class="overlay"><div><h2 id="title">准备好了吗？</h2><p id="msg">吃掉绿色能量块，别撞到自己或墙壁。</p><button id="start">开始游戏</button></div></div></section>
<div class="controls"><button class="up" data-d="up">▲</button><button class="left" data-d="left">◀</button><button class="down" data-d="down">▼</button><button class="right" data-d="right">▶</button></div><div class="tip">手机：滑动棋盘或点击方向键　电脑：方向键 / WASD　空格：暂停</div></main>
<script>
const c=document.getElementById('game'),x=c.getContext('2d'),N=20,S=c.width/N;
let snake,food,dir,next,score,timer,running=false,paused=false,speed=125;
const $=id=>document.getElementById(id), best=()=>Number(localStorage.snakeBest||0);
$('best').textContent=best();
function rnd(){return Math.floor(Math.random()*N)}
function spawn(){do{food={x:rnd(),y:rnd()}}while(snake.some(p=>p.x===food.x&&p.y===food.y))}
function reset(){snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];dir={x:1,y:0};next=dir;score=0;speed=125;$('score').textContent=0;spawn();draw()}
function setDir(dx,dy){if(!running||paused)return;if(dx!==-dir.x||dy!==-dir.y)next={x:dx,y:dy}}
function step(){dir=next;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.x>=N||h.y<0||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y))return over();snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;$('score').textContent=score;if(score>best()){localStorage.snakeBest=score;$('best').textContent=score}spawn();if(speed>65){speed-=3;clearInterval(timer);timer=setInterval(step,speed)}}else snake.pop();draw()}
function draw(){x.fillStyle='#08101d';x.fillRect(0,0,c.width,c.height);x.strokeStyle='#111c30';x.lineWidth=1;for(let i=0;i<=N;i++){x.beginPath();x.moveTo(i*S,0);x.lineTo(i*S,c.height);x.stroke();x.beginPath();x.moveTo(0,i*S);x.lineTo(c.width,i*S);x.stroke()}x.fillStyle='#69f0ae';x.shadowColor='#69f0ae';x.shadowBlur=16;x.beginPath();x.arc(food.x*S+S/2,food.y*S+S/2,S*.32,0,Math.PI*2);x.fill();x.shadowBlur=0;snake.forEach((p,i)=>{x.fillStyle=i?'#42a5f5':'#b3e5fc';x.fillRect(p.x*S+2,p.y*S+2,S-4,S-4)})}
function start(){clearInterval(timer);reset();running=true;paused=false;$('overlay').classList.add('hide');timer=setInterval(step,speed)}
function over(){running=false;clearInterval(timer);$('title').textContent='游戏结束';$('msg').textContent='本局得分 '+score+'，再来一局？';$('start').textContent='重新开始';$('overlay').classList.remove('hide')}
function pause(){if(!running)return;paused=!paused;if(paused){clearInterval(timer);$('title').textContent='已暂停';$('msg').textContent='按空格继续';$('start').textContent='继续';$('overlay').classList.remove('hide')}else{timer=setInterval(step,speed);$('overlay').classList.add('hide')}}
$('start').onclick=()=>paused?pause():start();
const keys={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();pause();return}if(keys[e.key]){e.preventDefault();setDir(...keys[e.key])}});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};setDir(...m[b.dataset.d])});
let sx=0,sy=0;c.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;Math.abs(dx)>Math.abs(dy)?setDir(Math.sign(dx),0):setDir(0,Math.sign(dy))},{passive:true});
reset();
</script></body></html>

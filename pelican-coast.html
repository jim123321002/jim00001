      <div class="scene-top"><div class="route-tag"><i></i> COASTAL LOOP · 海岸环线</div><button type="button" class="light-button" id="light-button" aria-pressed="false" aria-label="切换为黄昏配色"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.5"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4M3.6 16.4 5 15M15 5l1.4-1.4"/></svg><span id="light-label">日光</span></button></div>
      <div class="corner-caption">A LITTLE RIDE.<br>A LOVELY DAY.</div><span class="corner-number" aria-hidden="true">01</span>
    </div>
    <div class="console">
      <div class="status"><span class="status-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M3 8h12q5 0 5-3t-5-2M2 12h17q4 0 3 3t-5 1M6 16h5q4 0 4 3t-4 1"/></svg></span><div><strong id="status-title">海风正好，正在兜风</strong><small>不赶时间，也不赶路。</small></div></div>
      <div class="controls"><label class="speed-control" for="speed"><span>骑行速度</span><input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" aria-label="骑行速度" aria-valuetext="1.0 倍速"><output id="speed-value" for="speed">1.0×</output></label><button class="play-button" type="button" id="play-button" aria-label="暂停动画"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path id="pause-icon" d="M3 2h3v12H3zm7 0h3v12h-3Z"/><path id="play-icon" d="M4 2 14 8 4 14Z" hidden/></svg><span id="play-label">暂停</span></button></div>
    </div>
  </section>
  <noscript>当前显示静态插画；在浏览器中启用 JavaScript 后，鹈鹕就会开始骑行。</noscript>
  <footer class="footer"><span>纯 SVG 绘制 · 离线可用<span class="keyboard-hint"> · 空格键暂停 / 继续</span></span><span>ENJOY THE LITTLE THINGS.</span></footer>
</main>
<script>
'use strict';
(() => {
  const byId = id => document.getElementById(id);
  const el = Object.fromEntries(['rear-wheel','front-wheel','crank','rider','far-shin','far-foot','far-pedal','near-shin','leg-highlight','near-foot','near-pedal','scarf-tail','scarf-tail-two','eye','waves','rail-posts','road-marks','verge-pattern','sailboat','breeze','gull-a','gull-b','bike-shadow'].map(id => [id, byId(id)]));
  const clouds = [
    {node:byId('cloud-a'),x:135,y:155,scale:1,speed:10},
    {node:byId('cloud-b'),x:731,y:103,scale:.68,speed:6},
    {node:byId('cloud-c'),x:1038,y:239,scale:.82,speed:13},
    {node:byId('cloud-d'),x:438,y:92,scale:.55,speed:5}
  ];
  const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
  let playing = !motionPreference.matches;
  let speed = 1;
  let time = 0;
  let lastFrame = null;
  let frameId = null;
  const TAU = Math.PI * 2;
  const mod = (value, period) => ((value % period) + period) % period;
  const n = value => value.toFixed(2);
  const attr = (node, name, value) => node.setAttribute(name, value);

  // Analytic two-link inverse kinematics: each foot stays on its pedal,
  // while the upper and lower leg keep fixed lengths throughout the cycle.
  function leg(hipX, hipY, pedalX, pedalY, upper, lower) {
    const dx = pedalX - hipX, dy = pedalY - hipY;
    const length = Math.hypot(dx, dy);
    const distance = Math.max(.001, Math.min(length, upper + lower - .001));
    const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
    const height = Math.sqrt(Math.max(0, upper * upper - along * along));
    const ux = dx / Math.max(length, .001), uy = dy / Math.max(length, .001);
    const kneeX = hipX + ux * along + uy * height;
    const kneeY = hipY + uy * along - ux * height;
    return `M${n(hipX)} ${n(hipY)} Q${n(kneeX-3)} ${n(kneeY-5)} ${n(kneeX)} ${n(kneeY)} L${n(pedalX)} ${n(pedalY)}`;
  }
  function drawLeg(side, phase, bob) {
    const x = 575 + Math.cos(phase) * 31;
    const y = 512 + Math.sin(phase) * 31;
    const isNear = side === 'near';
    const path = leg(isNear ? 539 : 522, (isNear ? 388 : 391) + bob, x, y, 88, 95);
    attr(el[side+'-shin'], 'd', path);
    if (isNear) attr(el['leg-highlight'], 'd', path);
    attr(el[side+'-foot'], 'd', `M${n(x-9)} ${n(y-2)} Q${n(x-2)} ${n(y-9)} ${n(x+8)} ${n(y-1)} L${n(x+18)} ${n(y+5)} Q${n(x+5)} ${n(y+10)} ${n(x-10)} ${n(y+5)}Z`);
    attr(el[side+'-pedal'], 'd', `M${n(x-12)} ${n(y+9)}h29`);
  }
  function render() {
    const road = time * 222;
    const wheelAngle = road / 86;
    const crankAngle = wheelAngle / 1.3;
    const angleDegrees = mod(wheelAngle, TAU) * 180 / Math.PI;
    const bob = Math.sin(crankAngle * 2) * 1.9;
    attr(el['rear-wheel'], 'transform', `rotate(${n(angleDegrees)})`);
    attr(el['front-wheel'], 'transform', `rotate(${n(angleDegrees)})`);
    attr(el.crank, 'transform', `translate(575 512) rotate(${n(mod(crankAngle, TAU) * 180 / Math.PI)})`);
    attr(el.rider, 'transform', `translate(0 ${n(bob)})`);
    drawLeg('far', crankAngle + Math.PI, bob);
    drawLeg('near', crankAngle, bob);
    const flutter = Math.sin(time * 6.4) * 6;
    const flutter2 = Math.sin(time * 6.4 - 1.3) * 5;
    attr(el['scarf-tail'], 'd', `M607 280C578 ${n(266+flutter)} 550 ${n(282+flutter2)} 513 ${n(272+flutter)}L519 ${n(257+flutter)}C551 ${n(273+flutter2)} 580 ${n(249+flutter)} 611 264Z`);
    attr(el['scarf-tail-two'], 'd', `M605 277C573 ${n(285-flutter2)} 550 ${n(300-flutter)} 529 ${n(283-flutter2)}L535 ${n(271-flutter2)}C559 ${n(286-flutter)} 578 ${n(264-flutter2)} 609 267Z`);
    const blinkPhase = mod(time, 4.9);
    const blink = blinkPhase > 4.62 && blinkPhase < 4.84 ? Math.max(.08, Math.abs(blinkPhase - 4.73) / .11) : 1;
    attr(el.eye, 'transform', `translate(660 213) scale(1 ${n(blink)})`);
    attr(el['rail-posts'], 'patternTransform', `translate(${n(-mod(road * .69, 116))} 0)`);
    attr(el['road-marks'], 'patternTransform', `translate(${n(-mod(road, 175))} 0)`);
    attr(el['verge-pattern'], 'patternTransform', `translate(${n(-mod(road * 1.08, 430))} 0)`);
    attr(el.waves, 'transform', `translate(${n(-mod(time * 13, 240))} ${n(Math.sin(time*.8)*1.2)})`);
    clouds.forEach(c => attr(c.node, 'transform', `translate(${n(mod(c.x-time*c.speed+180,1580)-180)} ${c.y}) scale(${c.scale})`));
    const boatX = mod(242 - time * 8 + 50, 1330) - 50;
    attr(el.sailboat, 'transform', `translate(${n(boatX)} ${n(358+Math.sin(time*1.5)*2)}) rotate(${n(Math.sin(time*1.2)*2)})`);
    const flap = Math.sin(time * 2.5) * 4;
    attr(el['gull-a'], 'd', `M319 228q10 ${n(-9+flap)} 20 0 10 ${n(-9+flap)} 20 0`);
    attr(el['gull-b'], 'd', `M359 212q7 ${n(-7-flap*.7)} 14 0 7 ${n(-7-flap*.7)} 14 0`);
    attr(el.breeze, 'transform', `translate(${n(-Math.sin(time*3)*6)} 0)`);
    attr(el.breeze, 'opacity', n(.45 + (Math.sin(time*3)+1)*.2));
    attr(el['bike-shadow'], 'rx', n(218 - bob * .6));
  }
  function tick(timestamp) {
    frameId = null;
    if (!playing || document.hidden) {lastFrame = null; return;}
    if (lastFrame !== null) time += Math.min((timestamp-lastFrame)/1000, .06) * speed;
    lastFrame = timestamp;
    render();
    frameId = requestAnimationFrame(tick);
  }
  function schedule() {
    if (playing && !document.hidden && frameId === null) frameId = requestAnimationFrame(tick);
  }
  function updateControls() {
    byId('play-label').textContent = playing ? '暂停' : '继续骑行';
    byId('play-button').setAttribute('aria-label', playing ? '暂停动画' : '继续播放动画');
    byId('pause-icon').toggleAttribute('hidden', !playing);
    byId('play-icon').toggleAttribute('hidden', playing);
    byId('status-title').textContent = playing ? '海风正好，正在兜风' : '歇一歇，看看海';
  }
  function setPlaying(next) {
    playing = next;
    lastFrame = null;
    if (frameId !== null) {cancelAnimationFrame(frameId); frameId = null;}
    updateControls();
    schedule();
  }
  byId('play-button').addEventListener('click', () => setPlaying(!playing));
  byId('speed').addEventListener('input', event => {
    speed = Number(event.target.value);
    byId('speed-value').textContent = speed.toFixed(1) + '×';
    event.target.setAttribute('aria-valuetext', speed.toFixed(1) + ' 倍速');
  });
  byId('light-button').addEventListener('click', () => {
    const sunset = byId('canvas').classList.toggle('sunset');
    byId('light-button').setAttribute('aria-pressed', String(sunset));
    byId('light-button').setAttribute('aria-label', sunset ? '切换为日光配色' : '切换为黄昏配色');
    byId('light-label').textContent = sunset ? '黄昏' : '日光';
  });
  document.addEventListener('keydown', event => {
    if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
    if (event.target instanceof Element && event.target.closest('button,input,select,textarea,a,[contenteditable]')) return;
    event.preventDefault();
    setPlaying(!playing);
  });
  document.addEventListener('visibilitychange', () => {
    lastFrame = null;
    if (document.hidden && frameId !== null) {cancelAnimationFrame(frameId); frameId = null;}
    schedule();
  });
  if (motionPreference.addEventListener) motionPreference.addEventListener('change', event => {if (event.matches) setPlaying(false);});
  render();
  updateControls();
  schedule();
})();
</script>
</body>
</html>

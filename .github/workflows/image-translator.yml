name: Image Translator - Test and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'pelican-coast.html'
      - '.github/workflows/pelican-pages.yml'
      - 'word-game/**'
      - '.github/workflows/word-game-pages.yml'
  pull_request:
    paths-ignore:
      - 'pelican-coast.html'
      - '.github/workflows/pelican-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-translator-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}image-translator/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --ignore-scripts --no-audit --no-fund; else npm install --ignore-scripts --no-audit --no-fund; fi
      - name: Syntax, security and existing-project checks
        run: npm run check
      - name: Core unit tests
        run: npm test
      - name: Build complete static site with self-hosted OCR
        run: npm run build
      - name: Install browser and Chinese fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Desktop and Android browser integration tests
        env:
          TEST_STAGE: browser
        run: npm run test:browser
      - name: Live OCR and translation service integration
        env:
          TEST_STAGE: live
        run: npm run test:live
      - name: Configure workflow-based Pages source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow || echo "::warning::Could not change Pages source; attempting deployment with current settings."
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload verified Pages bundle
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy verified site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public revision, asset HTTP status and legacy game
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/verify-deployment.mjs '${{ steps.deployment.outputs.page_url }}'
      - name: Test the actual deployed website with real translation
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          LIVE_BASE_URL: ${{ steps.deployment.outputs.page_url }}image-translator/
          TEST_STAGE: deployed
        run: npm run test:live
      - name: Preserve diagnostics, screenshots and dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-translator-test-evidence
          path: |
            _reports/
            package-lock.json
          retention-days: 14
      - name: Preserve deployable website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: image-translator-website
          path: _site
          retention-days: 14
      - name: Acceptance summary
        if: success()
        run: |
          echo '## Image Translator verified' >> "$GITHUB_STEP_SUMMARY"
          echo 'Syntax + unit tests + desktop/mobile browser tests + real OCR/translation + public deployment checks passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Commit: `${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Acceptance: ${{ steps.deployment.outputs.page_url }}image-translator/' >> "$GITHUB_STEP_SUMMARY"
          echo 'Existing Snake game preserved at the root URL.' >> "$GITHUB_STEP_SUMMARY"

name: Test Snake Web Game

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game files
        run: |
          test -s index.html
          grep -q "霓虹贪吃蛇" index.html
          grep -q "function step" index.html
          grep -q "touchstart" index.html
          grep -q "localStorage" index.html
      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: snake-game
          path: index.html

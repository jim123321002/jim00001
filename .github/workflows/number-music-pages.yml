name: Number Music CI and Pages

on:
  push:
    branches: [main]
    paths:
      - 'number-music/**'
      - '.github/workflows/number-music-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: number-music-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: number-music
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: number-music/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: number-music-dist
          path: number-music/dist

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}number-music/
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Pages content
        run: |
          mkdir -p _site/number-music
          cp number-music/index.html _site/number-music/index.html
          cp index.html _site/index.html
          [ -d word-game ] && cp -r word-game _site/word-game || true
          [ -d image-translator ] && cp -r image-translator _site/image-translator || true
          [ -f pelican-coast.html ] && cp pelican-coast.html _site/pelican-coast.html || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

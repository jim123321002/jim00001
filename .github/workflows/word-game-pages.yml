name: Word Game CI and Pages
on:
  push:
    branches: [main]
    paths:
      - 'word-game/**'
      - '.github/workflows/word-game-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: word-game-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Core data and logic checks
        run: node word-game/test.mjs
      - name: Static file checks
        run: |
          test -f word-game/index.html
          test -f word-game/app.js
          test -f word-game/styles.css
          grep -q "Word Garden" word-game/index.html
  deploy:
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}word-game/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

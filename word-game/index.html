<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Garden 单词花园</title><link rel="stylesheet" href="./styles.css"></head><body>
<div id="app">
<section id="authView" class="screen auth-shell"><div class="auth-card">
<div class="brand">🌿 Word Garden</div><h1>把单词记成一场轻松的游戏</h1><p class="muted">注册后即可开始。学习进度会保存在当前设备。</p>
<div class="tabs"><button id="loginTab" class="tab active">登录</button><button id="registerTab" class="tab">注册</button></div>
<form id="authForm"><label>用户名<input id="username" required minlength="2" autocomplete="username"></label><label>密码<input id="password" type="password" required minlength="4" autocomplete="current-password"></label><button class="primary" type="submit" id="authSubmit">登录并开始</button></form>
<p id="authMsg" class="msg"></p></div></section>
<section id="gameView" class="screen hidden"><header><div><div class="brand">🌿 Word Garden</div><div class="sub">让记忆变得有节奏</div></div><div class="header-actions"><span id="welcome"></span><button id="logoutBtn" class="ghost">退出</button></div></header>
<main><aside class="panel sidebar"><h3>学习设置</h3><label>难度<select id="levelSelect"><option value="easy">简单</option><option value="medium">中等</option><option value="hard">困难</option><option value="all">全部</option><option value="review">重点复习</option></select></label><label>训练模式<select id="modeSelect"><option value="learn">看图记忆</option><option value="quiz">选择测试</option></select></label><div class="stats-grid"><div><b id="learnedCount">0</b><span>已学习</span></div><div><b id="masteredCount">0</b><span>较熟练</span></div><div><b id="reviewCount">0</b><span>待复习</span></div><div><b id="streakCount">0</b><span>连续正确</span></div></div><button id="resetBtn" class="danger-link">重置学习进度</button></aside>
<section class="study"><div class="progress-row"><span id="progressText">准备开始</span><div class="bar"><i id="progressBar"></i></div></div>
<article class="word-card"><div id="imageBox" class="image-box"></div><div class="badge" id="levelBadge">简单</div><h2 id="wordText">apple</h2><p id="phonetic">/ˈæpəl/</p><h3 id="meaning">苹果</h3><p id="example">I eat an apple every day.</p><div id="quizOptions" class="quiz-options hidden"></div></article>
<div class="actions" id="learnActions"><button class="again" data-rate="again">没记住</button><button class="hard" data-rate="hard">有点难</button><button class="good" data-rate="good">记住了</button></div>
<div class="actions hidden" id="quizActions"><button id="nextQuiz" class="primary">下一题</button></div>
<p id="feedback" class="feedback"></p></section></main></section></div>
<script type="module" src="./app.js?v=20260920-3"></script></body></html>
